name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Show repo structure
        run: find . -path ./.git -prune -o -type f -print | head -50
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        working-directory: "AI_GeminiLive_Project (1)/AI_GeminiLive_Project"
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AI-debug-apk
          path: "AI_GeminiLive_Project (1)/AI_GeminiLive_Project/app/build/outputs/apk/debug/app-debug.apk"
